databases:
  - name: spmmm-postgres
    plan: free
    databaseName: student_progress
    user: spmmm_user

services:
  - type: web
    name: spmmm-student-progress
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spmmm-postgres
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
